function calcExitPL(){
  var ctx=window._closeCtx||{}; var g=function(x){var e=document.getElementById(x);return e?e.value:"";};
  var exit=toNum(g("c_price"));
  if(exit===null||ctx.entry===null||ctx.lot===null||ctx.cs===null) return null;
  var diff = ctx.dir==="short" ? (ctx.entry-exit) : (exit-ctx.entry);
  // 口座通貨に直す（レートはエントリー時の値を記録から持ってくる）
  return diff*ctx.lot*ctx.cs*(isNum(ctx.fx)&&ctx.fx>0?ctx.fx:1);
}

function closePLValue(){
  var el=document.getElementById("c_pl"); if(!el) return null;
  var v=toNum(el.value); if(!isNum(v)) return null;
  return (CLOSE.plSign==="pos"?1:-1)*Math.abs(v);
}
window.closeSignPick=function(v){
  CLOSE.plSign=v; CLOSE.plSignTouched=true;
  var box=document.getElementById("c_plsign"); if(box){
    Array.prototype.forEach.call(box.querySelectorAll("button"),function(b){
      b.classList.toggle("on", b.getAttribute("data-v")===v);
    });
  }
  renderClosePLHint();
};
function renderClosePLHint(){
  var ctx=window._closeCtx||{}, unit=ctx.cur?(" "+ctx.cur):"";
  var sug=calcExitPL();
  // 符号をまだ自分で選んでいなければ、決済価格から出た符号に合わせる
  if(sug!==null && !CLOSE.plSignTouched){
    var want=sug>=0?"pos":"neg";
    if(CLOSE.plSign!==want){
      CLOSE.plSign=want;
      var sb=document.getElementById("c_plsign");
      if(sb) Array.prototype.forEach.call(sb.querySelectorAll("button"),function(b){
        b.classList.toggle("on", b.getAttribute("data-v")===want);
      });
    }
  }
  // 実際に保存される値を、保存ボタンの手前に出す（符号の取り違えよけ）
  var sum=document.getElementById("c_plsum");
  if(sum){
    var v=closePLValue();
    sum.innerHTML = (v===null) ? "" :
      "登録される実現損益 <span class='"+clsSign(v)+"'>"+esc(fmtSigned(round2(v))+unit)+"</span>";
  }
  var box=document.getElementById("c_plhint"); if(!box) return;
  if(sug===null){ box.innerHTML=""; return; }
  var cur=closePLValue();
  var same = cur!==null && Math.abs(cur-sug)<0.5;
  box.innerHTML="<div class='plhint'>決済価格から計算：<span class='"+clsSign(sug)+"'>"+esc(fmtSigned(round2(sug))+unit)+"</span>"+
    (same?" <span class='muted'>（反映済み）</span>":" <button type='button' class='miniapply' onclick='applyExitPL()'>実現損益に反映</button>")+
    "<div class='smallnote'>手数料・スワップは含みません。実際の約定額と違えば上書きしてOK</div></div>";
}
window.applyExitPL=function(){
  var sug=calcExitPL(); if(sug===null) return;
  CLOSE.plSign = sug>=0?"pos":"neg";
  var sb=document.getElementById("c_plsign");
  if(sb) Array.prototype.forEach.call(sb.querySelectorAll("button"),function(b){
    b.classList.toggle("on", b.getAttribute("data-v")===CLOSE.plSign);
  });
  var el=document.getElementById("c_pl"); if(el){ el.value=String(Math.abs(round2(sug))); }
  renderClosePLHint();
};

function researchCard(r){
  var badge={"研究中":"study","正式採用":"adopt","保留":"hold","却下":"reject"}[r.status]||"study";
  // 関連トレード（タグ一致）
  var linked = DB.trades.filter(function(t){ return t.status==="closed" && (t.tags||[]).some(function(tag){ return (r.tags||[]).indexOf(tag)>=0; }); });
  var st=computeStats(linked);
  var h="<div class='rcard'>";
  h+="<div class='rhh'><div class='rtt'>"+esc(r.title)+"</div><span class='badge "+badge+"'>"+esc(r.status)+"</span></div>";
  if(r.hypothesis) h+="<div class='smallnote' style='color:var(--txt2);margin-bottom:8px'>仮説: "+esc(r.hypothesis)+"</div>";
  if((r.tags||[]).length) h+="<div class='tmeta'>"+r.tags.map(function(t){return "<span class='pill'>#"+esc(t)+"</span>";}).join("")+"</div>";
  h+="<div class='grid3'>";
  h+=stat("対象数", "<span class='tabular'>"+st.n+"</span>",true);
  h+=stat("勝率", st.winRate!==null?("<span class='tabular'>"+fmtPct(st.winRate,0)+"</span>"):"—",true);
  h+=stat("平均R", st.avgR!==null?("<span class='"+clsSign(st.avgR)+" tabular'>"+fmtR(st.avgR)+"</span>"):"—",true);
  h+="</div>";
  h+="<div class='grid2' style='margin-top:8px'>";
  h+=stat("PF", st.pf!==null?("<span class='tabular'>"+st.pf.toFixed(2)+"</span>"):"—",true);
  h+=stat("純R", st.rCount?("<span class='"+clsSign(st.netR)+" tabular'>"+fmtR(st.netR)+"</span>"):"—",true);
  h+="</div>";
  if(r.conclusion) h+="<div class='memo' style='margin-top:10px'>結論: "+esc(r.conclusion)+"</div>";
  h+="<div class='btnrow' style='margin-top:10px'><button class='btn ghost sm' onclick=\"editResearch('"+r.id+"')\">編集</button><button class='btn danger sm' onclick=\"delResearch('"+r.id+"')\">削除</button></div>";
  h+="</div>";
  return h;
}

window.saveSettings=function(){
  var g=function(x){var e=document.getElementById(x);return e?e.value:"";};
  var s=DB.settings;
  s.appName=g("s_appName")||"ぼぶる";
  var prevCur=s.currency;
  s.currency=(g("s_currency")||"USD").toUpperCase();
  var fxa=document.getElementById("s_fxauto"); if(fxa) s.fx.auto=fxa.checked;
  s.fx.manual=g("s_fxmanual")===""?null:toNum(g("s_fxmanual"));
  if(prevCur!==s.currency){
    s.fx.rate=null; s.fx.at=null; s.fx.rateAt=null; s.fx.quote=""; s.fx.source=""; FX.lastError="";
  }
  s.accountName=g("s_accName");
  s.initialBalance=toNum(g("s_init")); s.contractSize=toNum(g("s_cs"))||100;
  // 口座名・種別・初期残高は「いまの口座」そのものを編集している
  var accNow=currentAccount();
  if(accNow){
    accNow.name=s.accountName||accNow.name;
    var tsel=g("s_accType");
    var prevType=accNow.type;
    accNow.type=isAccountType(tsel)?tsel:"";
    if(accNow.type!==prevType){
      var tp0=findTemplate(accNow.template);
      accNow.rules.targetPct = tp0 ? tp0.targets[accNow.type] :
        (accNow.type==="step1"?numOr(s.fin.step1TargetPct,null):accNow.type==="step2"?numOr(s.fin.step2TargetPct,null):null);
      if(accNow.rules.targetPct===undefined) accNow.rules.targetPct=null;
    }
    if(accNow.type) accNow.typeNote="";
    accNow.initialBalance=isNum(s.initialBalance)?s.initialBalance:accNow.initialBalance;
    accNow.currency=s.currency||accNow.currency;
    applyAccountToSettings(accNow);
  }else{
    s.accountType=g("s_accType");
  }
  s.balanceMode=g("s_balmode"); s.manualBalance=g("s_manual")===""?null:toNum(g("s_manual"));
  s.internalRiskPct=toNum(g("s_irisk"))||1; s.baseLot=toNum(g("s_blot")); s.lossStreakWarn=toNum(g("s_streak"))||4;
  var th=g("s_theme"); s.theme=th; applyTheme();
  saveData(); toast("設定を保存しました"); render();
};
window.copySyncCode=function(){
  var code=syncData("export");

  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done).catch(function(){ promptCopy(code); }); }
  else promptCopy(code);
};

function downloadFile(name,content,mime){
  try{
    var blob=new Blob([content],{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100);
  }catch(e){ window.prompt("コピーして保存して下さい",content); }
}

/* ---------- 画像圧縮 ---------- */
function compressImage(file, onok, onerr){
  try{
    var reader=new FileReader();
    reader.onerror=function(){ onerr&&onerr(); };
    reader.onload=function(){
      var img=new Image();
      img.onerror=function(){ onerr&&onerr(); };
      img.onload=function(){
        try{
          var maxEdge=1600;
          var w=img.naturalWidth||img.width, hh=img.naturalHeight||img.height;
          var scale=Math.min(1, maxEdge/Math.max(w,hh));
          var cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(hh*scale));
          var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
          var ctx=cv.getContext("2d"); ctx.drawImage(img,0,0,cw,ch);
          var out=cv.toDataURL("image/jpeg",0.78);
          onok(out);
        }catch(e){ onerr&&onerr(); }
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }catch(e){ onerr&&onerr(); }
}

/* ---------- チャート（Canvas 軽量描画） ---------- */
// PCでは縦にも余裕があるのでグラフを高くする（描画は resize で追従）
function chartH(base){
  var w=window.innerWidth||0;
  if(w>=1180) return Math.round(base*1.5);
  if(w>=900)  return Math.round(base*1.3);
  return base;
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function setupCanvas(cv,cssH){
  var dpr=window.devicePixelRatio||1;
  var w=cv.clientWidth||cv.parentNode.clientWidth||300;
  cv.width=Math.round(w*dpr); cv.height=Math.round(cssH*dpr);
  cv.style.height=cssH+"px";
  var ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx:ctx,w:w,h:cssH};
}
function drawLineChart(cv,cssH,pts,color,opt){
  opt=opt||{};
  var s=setupCanvas(cv,cssH); var ctx=s.ctx,w=s.w,h=s.h;
  var padL=opt.padL!=null?opt.padL:44, padR=10, padT=10, padB=18;
  ctx.clearRect(0,0,w,h);
  if(!pts.length){ return; }
  var xs=pts.map(function(p){return p.x;}), ys=pts.map(function(p){return p.y;});
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  if(opt.baseline0!==false){ minY=Math.min(minY,0); maxY=Math.max(maxY,0); }
  if(minY===maxY){ maxY=minY+1; minY=minY-1; }
  var pad=(maxY-minY)*0.12; minY-=pad; maxY+=pad;
  var n=pts.length;
  var X=function(i){ return padL + (n<=1?0.5:i/(n-1))*(w-padL-padR); };
  var Y=function(v){ return padT + (1-(v-minY)/(maxY-minY))*(h-padT-padB); };
  var line=cssVar("--line");
  // grid + labels
  ctx.strokeStyle=line; ctx.fillStyle=cssVar("--txt3"); ctx.lineWidth=1; ctx.font="10px -apple-system,sans-serif";
  var ticks=4;
  for(var g=0;g<=ticks;g++){
    var val=minY+(maxY-minY)*g/ticks; var yy=Y(val);
    ctx.globalAlpha=.5; ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(w-padR,yy); ctx.stroke(); ctx.globalAlpha=1;
    var lab=opt.fmt?opt.fmt(val):(Math.round(val)).toString();
    ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(lab,padL-6,yy);
  }
  // zero line
  if(minY<0&&maxY>0){ var z=Y(0); ctx.strokeStyle=cssVar("--line2"); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(padL,z); ctx.lineTo(w-padR,z); ctx.stroke(); }
  // area fill
  var grad=ctx.createLinearGradient(0,padT,0,h-padB);
  grad.addColorStop(0, hexA(color,0.22)); grad.addColorStop(1, hexA(color,0.0));
  ctx.beginPath(); ctx.moveTo(X(0),Y(pts[0].y));
  for(var i=1;i<n;i++) ctx.lineTo(X(i),Y(pts[i].y));
  ctx.lineTo(X(n-1),h-padB); ctx.lineTo(X(0),h-padB); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  // line
  ctx.beginPath(); ctx.moveTo(X(0),Y(pts[0].y));
  for(var j=1;j<n;j++) ctx.lineTo(X(j),Y(pts[j].y));
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  // last dot
  ctx.fillStyle=color; ctx.beginPath(); ctx.arc(X(n-1),Y(pts[n-1].y),3,0,Math.PI*2); ctx.fill();
}
function drawBarChart(cv,cssH,labels,values,opt){
  opt=opt||{};
  var s=setupCanvas(cv,cssH); var ctx=s.ctx,w=s.w,h=s.h;
  var padL=44,padR=10,padT=10,padB=26;
  ctx.clearRect(0,0,w,h);
  if(!values.length){ return; }
  var maxV=Math.max.apply(null,values.concat([0])), minV=Math.min.apply(null,values.concat([0]));
  if(minV===maxV){ maxV=minV+1; minV=minV-1; }
  var padd=(maxV-minV)*0.15; maxV+=padd; minV-=padd; if(minV>0)minV=0; if(maxV<0)maxV=0;
  var Y=function(v){ return padT + (1-(v-minV)/(maxV-minV))*(h-padT-padB); };
  var n=values.length; var gap=8; var bw=(w-padL-padR-gap*(n))/n;
  ctx.strokeStyle=cssVar("--line"); ctx.fillStyle=cssVar("--txt3"); ctx.font="10px -apple-system,sans-serif";
  var ticks=3;
  for(var g2=0;g2<=ticks;g2++){ var val=minV+(maxV-minV)*g2/ticks; var yy=Y(val); ctx.globalAlpha=.5; ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(w-padR,yy); ctx.stroke(); ctx.globalAlpha=1; ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(opt.fmt?opt.fmt(val):val.toFixed(1),padL-6,yy); }
  var zeroY=Y(0);
  ctx.strokeStyle=cssVar("--line2"); ctx.beginPath(); ctx.moveTo(padL,zeroY); ctx.lineTo(w-padR,zeroY); ctx.stroke();
  var green=cssVar("--green"), red=cssVar("--red");
  for(var i=0;i<n;i++){
    var x=padL+gap/2+i*(bw+gap); var v=values[i]; var y=Y(v);
    ctx.fillStyle = v>=0?green:red;
    var top=Math.min(y,zeroY), hgt=Math.abs(zeroY-y);
    roundRect(ctx,x,top,bw,Math.max(1,hgt),3); ctx.fill();
    ctx.fillStyle=cssVar("--txt3"); ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillText(labels[i], x+bw/2, h-padB+6);
  }
}
function roundRect(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function hexA(c,a){
  c=c.trim();
  if(c[0]==="#"){ var n=c.slice(1); if(n.length===3) n=n[0]+n[0]+n[1]+n[1]+n[2]+n[2]; var r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16); return "rgba("+r+","+g+","+b+","+a+")"; }
  return c;
}

function abbr(v){ var a=Math.abs(v); if(a>=1000000) return (v/1000000).toFixed(1)+"M"; if(a>=1000) return Math.round(v/1000)+"k"; return Math.round(v).toString(); }

function drawGrowthCharts(){
  var list=DB.trades.filter(function(t){return t.status==="closed"&&inViewAcct(t,false)&&inPeriod(t,UI.growthPeriod,UI.growthCustom);})
    .sort(function(a,b){return new Date(a.closedAt||a.createdAt)-new Date(b.closedAt||b.createdAt);});
  if(!list.length) return;
  // 累積損益
  var cp=document.getElementById("c_cumpl");
  if(cp){ var cum=0; var pts=[{x:0,y:0}]; list.forEach(function(t,i){ var pl=toNum(t.realizedPL); if(isNum(pl)) cum+=pl; pts.push({x:i+1,y:cum}); }); drawLineChart(cp,chartH(150),pts,cssVar("--gold"),{fmt:function(v){return abbr(v);}}); }
  // 累積R
  var cr=document.getElementById("c_cumr");
  if(cr){ var cumR=0; var ptsR=[{x:0,y:0}]; list.forEach(function(t,i){ var c=calcTrade(t); if(isNum(c.realizedR)) cumR+=c.realizedR; ptsR.push({x:i+1,y:cumR}); }); drawLineChart(cr,chartH(150),ptsR,cssVar("--blue"),{fmt:function(v){return v.toFixed(1)+"R";}}); }
  // 口座残高推移
  var ce=document.getElementById("c_equity");
  if(ce){ var va=findAccount(viewAcctId(false)); var init=va?(toNum(va.initialBalance)||0):(toNum(DB.settings.initialBalance)||0); var eq=init; var ptsE=[{x:0,y:init}]; list.forEach(function(t,i){ var pl=toNum(t.realizedPL); if(isNum(pl)) eq+=pl; ptsE.push({x:i+1,y:eq}); }); drawLineChart(ce,chartH(150),ptsE,cssVar("--green"),{baseline0:false,fmt:function(v){return abbr(v);}}); }
  // パターン別平均R
  var cpr=document.getElementById("c_patr");
  if(cpr){
    var groups=[["A","パターンA",function(t){return t.pattern==="A";}],["B","パターンB",function(t){return t.pattern==="B";}],["レンジ","レンジ戦略",function(t){return t.pattern==="range";}],["他","その他",function(t){return t.pattern==="other"||!t.pattern;}]];
    var labels=[],vals=[],labtxt=[];
    groups.forEach(function(g){ var sub=list.filter(g[2]); var st=computeStats(sub); if(sub.length){ labels.push(g[0]); vals.push(st.avgR!==null?st.avgR:0); labtxt.push(g[1]+"(n="+sub.length+")"); } });
    if(vals.length){ drawBarChart(cpr,chartH(150),labels,vals,{fmt:function(v){return v.toFixed(1)+"R";}}); document.getElementById("c_patr_lab").textContent=labtxt.join("　"); }
    else { document.getElementById("c_patr_lab").textContent="データなし"; }
  }
  // 4H環境別平均R
  var ch4=document.getElementById("c_h4r");
  if(ch4){
    var g4=[["上昇","上昇",function(t){return t.h4env==="up";}],["下降","下降",function(t){return t.h4env==="down";}],["レンジ","レンジ",function(t){return t.h4env==="range";}]];
    var labels2=[],vals2=[],labtxt2=[];
    g4.forEach(function(g){ var sub=list.filter(g[2]); var st=computeStats(sub); if(sub.length){ labels2.push(g[0]); vals2.push(st.avgR!==null?st.avgR:0); labtxt2.push(g[1]+"(n="+sub.length+")"); } });
    if(vals2.length){ drawBarChart(ch4,chartH(150),labels2,vals2,{fmt:function(v){return v.toFixed(1)+"R";}}); document.getElementById("c_h4r_lab").textContent=labtxt2.join("　"); }
    else { document.getElementById("c_h4r_lab").textContent="データなし"; }
  }
}

/* ---------- テーマ ---------- */
function applyTheme(){
  var t=DB.settings.theme;
  if(t==="system"){
    var dark=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark?"dark":"light");
  }else{
    document.documentElement.setAttribute("data-theme", t==="light"?"light":"dark");
  }
  var mc=document.querySelector('meta[name=theme-color]');
  if(mc) mc.setAttribute("content", document.documentElement.getAttribute("data-theme")==="light"?"#f6f7fa":"#141821");
}

/* ---------- 起動 ---------- */
function boot(){
  loadData();
  applyTheme();
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(b){
    b.addEventListener("click",function(){ TAB=b.getAttribute("data-tab"); if(TAB!=="plan"){} render(); });
  });
  bindBriefLiveSync();
  // 画面に戻ってきたら、期限が切れていればレートを取り直す
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden) ensureFxRate();
  });
  window.addEventListener("beforeunload",function(e){
    // 保存していない環境認識があるまま閉じる／再読込するのを止める
    if(!briefDirty()) return;
    e.preventDefault(); e.returnValue=""; return "";
  });
  if(window.matchMedia){
    try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){ if(DB.settings.theme==="system") applyTheme(); }); }catch(e){}
  }
  render();
}
window.addEventListener("resize",function(){ if(TAB==="growth") drawGrowthCharts(); });
document.addEventListener("DOMContentLoaded",boot);
